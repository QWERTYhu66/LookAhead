[project]
name = "lookahead-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "pyarrow>=18.0.0",
    "joblib>=1.4.0",
    "requests>=2.31.0",
]

[project.scripts]
lookahead-api = "api.main:run"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
